name: Auto Curate & Open Draft PRs

on:
  schedule:
    # 07:00, 13:00, 19:00 JST (22:00, 04:00, 10:00 UTC)
    - cron: '0 22,4,10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect source URLs from existing draft PRs (open & closed)
        id: pr_seen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const raw = execFileSync(
            'gh',
            ['pr', 'list', '--state', 'all', '--limit', '100', '--json', 'headRefName,body'],
            { encoding: 'utf8' }
          );
          const prs = JSON.parse(raw);
          const urls = new Set();
          for (const pr of prs) {
            if (!String(pr.headRefName || '').startsWith('draft/')) continue;
            const body = String(pr.body || '');
            const match = body.match(/元ソース\*\*:\s*\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/);
            if (match?.[1]) {
              urls.add(match[1]);
            }
          }
          fs.writeFileSync('/tmp/extra-seen-urls.json', JSON.stringify(Array.from(urls)));
          console.log(`Collected ${urls.size} source URL(s) from existing draft PRs.`);
          EOF

      - name: Run curation pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXTRA_SEEN_URLS="$(cat /tmp/extra-seen-urls.json)" npm run curate

      - name: Create one conflict-free draft Pull Request per generated article
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const manifestPath = 'data/draft-manifest.json';
          if (!fs.existsSync(manifestPath)) {
            console.log('No draft manifest found.');
            process.exit(0);
          }

          const drafts = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (!Array.isArray(drafts) || drafts.length === 0) {
            console.log('No new draft articles generated.');
            process.exit(0);
          }

          execFileSync('git', ['config', 'user.name', 'musubi-curator[bot]']);
          execFileSync('git', ['config', 'user.email', 'musubi-curator[bot]@users.noreply.github.com']);

          for (const draft of drafts) {
            const articleContent = fs.readFileSync(draft.filePath, 'utf8');
            const existingPr = execFileSync(
              'gh',
              ['pr', 'list', '--head', draft.branchName, '--state', 'all', '--json', 'number'],
              { encoding: 'utf8' }
            );
            if (JSON.parse(existingPr).length > 0) {
              console.log(`Skipping existing branch/PR: ${draft.branchName}`);
              continue;
            }

            execFileSync('git', ['checkout', '-B', draft.branchName, 'origin/main']);
            fs.writeFileSync(draft.filePath, articleContent, 'utf8');

            // Only commit the single new article file so concurrent draft PRs NEVER conflict
            execFileSync('git', ['add', draft.filePath]);
            execFileSync('git', ['commit', '-m', `content: add draft article ${draft.slug}`]);
            execFileSync('git', ['push', '-f', 'origin', draft.branchName]);

            execFileSync('gh', [
              'pr',
              'create',
              '--base',
              'main',
              '--head',
              draft.branchName,
              '--title',
              draft.prTitle,
              '--body',
              draft.prBody,
            ]);
          }
          EOF
